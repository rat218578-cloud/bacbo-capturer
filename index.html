<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, user-scalable=no">
    <title>Rick Roleta - Sinais Ao Vivo</title>
    <link href="https://fonts.googleapis.com/css2?family=Raleway:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #6000ff;
            --primary-hover: #5600e5;
            --bg: #090808;
            --bg-card: #1a1a1a;
            --text: #ffffff;
            --text-secondary: #888;
            --green: #00ff88;
            --red: #ff3355;
            --yellow: #ffaa00;
        }
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Raleway', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
        }
        
        /* Loading inicial */
        .loader {
            position: fixed;
            inset: 0;
            background: #121212;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            transition: opacity 0.5s;
        }
        .loader.hidden { opacity: 0; pointer-events: none; }
        .spinner {
            width: 64px; height: 64px;
            border: 4px solid #2a2a2a;
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        
        /* Header */
        .header {
            background: var(--bg);
            padding: 20px;
            border-bottom: 1px solid #222;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .header-content {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
            flex-wrap: wrap;
        }
        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 20px;
            font-weight: 700;
        }
        .logo-icon {
            width: 40px; height: 40px;
            background: var(--primary);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
        }
        
        /* Filtros */
        .filters {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        .filter-btn {
            padding: 8px 16px;
            border: 1px solid #333;
            border-radius: 20px;
            background: transparent;
            color: var(--text-secondary);
            cursor: pointer;
            font-size: 13px;
            font-family: 'Raleway', sans-serif;
            transition: all 0.3s;
        }
        .filter-btn:hover { border-color: var(--primary); color: var(--text); }
        .filter-btn.active {
            background: var(--primary);
            border-color: var(--primary);
            color: white;
        }
        
        /* Stats */
        .stats-bar {
            max-width: 1200px;
            margin: 20px auto;
            padding: 0 20px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 10px;
        }
        .stat-card {
            background: var(--bg-card);
            border-radius: 12px;
            padding: 15px;
            text-align: center;
            border: 1px solid #222;
        }
        .stat-value { font-size: 28px; font-weight: 700; }
        .stat-label { font-size: 12px; color: var(--text-secondary); margin-top: 5px; }
        .stat-total .stat-value { color: var(--primary); }
        .stat-green .stat-value { color: var(--green); }
        .stat-red .stat-value { color: var(--red); }
        .stat-entrada .stat-value { color: var(--yellow); }
        
        /* Grid de Sinais */
        .sinais-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px 40px;
        }
        .sinais-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 12px;
        }
        
        /* Card */
        .sinal-card {
            background: var(--bg-card);
            border-radius: 12px;
            padding: 16px;
            border-left: 4px solid var(--text-secondary);
            border: 1px solid #222;
            transition: all 0.3s;
            position: relative;
            overflow: hidden;
        }
        .sinal-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0;
            width: 4px; height: 100%;
            background: var(--text-secondary);
        }
        .sinal-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(96,0,255,0.15);
            border-color: var(--primary);
        }
        .sinal-card.green::before { background: var(--green); }
        .sinal-card.red::before { background: var(--red); }
        .sinal-card.entrada::before { background: var(--yellow); }
        .sinal-card.entrada {
            animation: pulse-card 2s infinite;
        }
        @keyframes pulse-card {
            0%, 100% { box-shadow: 0 0 10px rgba(255,170,0,0.1); }
            50% { box-shadow: 0 0 20px rgba(255,170,0,0.3); }
        }
        
        .card-tipo {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: 700;
            margin-bottom: 8px;
        }
        .card-tipo.green { color: var(--green); }
        .card-tipo.red { color: var(--red); }
        .card-tipo.entrada { color: var(--yellow); }
        .card-tipo.analisando { color: var(--text-secondary); }
        
        .card-jogo { font-size: 12px; color: var(--text-secondary); margin-bottom: 4px; }
        .card-id { font-size: 11px; color: #444; margin-bottom: 8px; font-family: monospace; }
        
        .card-entrada {
            font-size: 16px;
            font-weight: 600;
            margin: 8px 0;
            color: var(--text);
            line-height: 1.4;
        }
        .card-anterior {
            font-size: 12px;
            color: #666;
            font-family: monospace;
            margin: 6px 0;
            padding: 6px 8px;
            background: #111;
            border-radius: 6px;
        }
        
        .card-status {
            display: inline-block;
            padding: 2px 10px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 600;
            margin: 4px 0;
        }
        .card-status.active { background: rgba(0,255,136,0.1); color: var(--green); }
        .card-status.inactive { background: rgba(255,51,85,0.1); color: var(--red); }
        
        .card-resultado {
            font-weight: 700;
            font-size: 14px;
            margin-top: 4px;
        }
        .card-resultado.green { color: var(--green); }
        .card-resultado.red { color: var(--red); }
        
        .card-data {
            font-size: 10px;
            color: #444;
            margin-top: 8px;
        }
        .card-slug {
            font-size: 10px;
            color: #333;
            margin-top: 2px;
            font-family: monospace;
        }
        
        /* Footer atualização */
        .refresh-info {
            text-align: center;
            padding: 20px;
            color: #444;
            font-size: 12px;
        }
        
        /* Responsivo */
        @media (max-width: 600px) {
            .sinais-grid {
                grid-template-columns: 1fr;
            }
            .header-content {
                flex-direction: column;
                text-align: center;
            }
            .stats-bar {
                grid-template-columns: repeat(2, 1fr);
            }
        }
    </style>
</head>
<body>
    <!-- Loader -->
    <div class="loader" id="loader">
        <div class="spinner"></div>
    </div>

    <!-- Header -->
    <header class="header">
        <div class="header-content">
            <div class="logo">
                <div class="logo-icon">🎰</div>
                <span>Rick Roleta <span style="color: var(--text-secondary); font-weight: 400; font-size: 14px;">Sinais</span></span>
            </div>
            <div class="filters" id="filters">
                <button class="filter-btn active" data-filter="all">🔥 Todos</button>
                <button class="filter-btn" data-filter="bacbo">🎲 Bac Bo</button>
                <button class="filter-btn" data-filter="roleta">🎡 Roleta</button>
                <button class="filter-btn" data-filter="entrada">🎯 Entradas</button>
                <button class="filter-btn" data-filter="green">✅ Green</button>
            </div>
        </div>
    </header>

    <!-- Stats -->
    <div class="stats-bar" id="statsBar">
        <div class="stat-card stat-total">
            <div class="stat-value" id="totalSinais">0</div>
            <div class="stat-label">Total Sinais</div>
        </div>
        <div class="stat-card stat-green">
            <div class="stat-value" id="totalGreen">0</div>
            <div class="stat-label">✅ Green</div>
        </div>
        <div class="stat-card stat-red">
            <div class="stat-value" id="totalRed">0</div>
            <div class="stat-label">❌ Red</div>
        </div>
        <div class="stat-card stat-entrada">
            <div class="stat-value" id="totalEntrada">0</div>
            <div class="stat-label">🎯 Entradas</div>
        </div>
        <div class="stat-card">
            <div class="stat-value" id="assertividade" style="color: var(--yellow);">0%</div>
            <div class="stat-label">📊 Assertividade</div>
        </div>
    </div>

    <!-- Grid de Sinais -->
    <div class="sinais-container">
        <div class="sinais-grid" id="sinaisGrid"></div>
    </div>

    <div class="refresh-info" id="refreshInfo">
        ⏱️ Atualizando a cada 5 segundos | Aguardando dados...
    </div>

    <script>
        let todosSinais = [];
        let filtroAtivo = 'all';

        // Filtros
        document.querySelectorAll('.filter-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                filtroAtivo = btn.dataset.filter;
                aplicarFiltro();
            });
        });

        function aplicarFiltro() {
            let filtrados = todosSinais;
            
            if (filtroAtivo === 'bacbo') {
                filtrados = todosSinais.filter(s => 
                    s.jogo?.toLowerCase().includes('bacbo') || 
                    s.tipo_sinal?.toLowerCase().includes('bacbo') ||
                    s.gameSlug?.toLowerCase().includes('bac-bo')
                );
            } else if (filtroAtivo === 'roleta') {
                filtrados = todosSinais.filter(s => 
                    !s.jogo?.toLowerCase().includes('bacbo') && 
                    !s.tipo_sinal?.toLowerCase().includes('bacbo')
                );
            } else if (filtroAtivo === 'entrada') {
                filtrados = todosSinais.filter(s => s.tipo === 'entrada');
            } else if (filtroAtivo === 'green') {
                filtrados = todosSinais.filter(s => s.tipo === 'green' || s.resultado === 'GREEN');
            }
            
            renderizarSinais(filtrados);
        }

        async function buscarSinais() {
            try {
                const res = await fetch('https://rickroleta.com.br/api/sinais?limit=100');
                const data = await res.json();
                
                if (!data.sinais || !Array.isArray(data.sinais)) return;
                
                todosSinais = data.sinais;
                
                // Atualiza stats
                const greens = todosSinais.filter(s => s.tipo === 'green' || s.resultado === 'GREEN').length;
                const reds = todosSinais.filter(s => s.tipo === 'red' || s.resultado === 'LOSS').length;
                const entradas = todosSinais.filter(s => s.tipo === 'entrada').length;
                const total = greens + reds;
                const assertividade = total > 0 ? Math.round((greens / total) * 100) : 0;
                
                document.getElementById('totalSinais').textContent = data.total || todosSinais.length;
                document.getElementById('totalGreen').textContent = greens;
                document.getElementById('totalRed').textContent = reds;
                document.getElementById('totalEntrada').textContent = entradas;
                document.getElementById('assertividade').textContent = assertividade + '%';
                
                aplicarFiltro();
                
                document.getElementById('refreshInfo').innerHTML = 
                    `⏱️ Atualizando a cada 5 segundos | Última atualização: ${new Date().toLocaleTimeString('pt-BR')} | ${todosSinais.length} sinais carregados`;
                
                // Esconde loader
                document.getElementById('loader').classList.add('hidden');
                
            } catch (e) {
                console.error('Erro:', e);
            }
        }

        function renderizarSinais(sinais) {
            const grid = document.getElementById('sinaisGrid');
            
            if (sinais.length === 0) {
                grid.innerHTML = '<div style="text-align:center;padding:40px;color:#444">Nenhum sinal encontrado para este filtro</div>';
                return;
            }
            
            grid.innerHTML = sinais.map(sinal => {
                let cardClass = 'sinal-card';
                let tipoClass = 'card-tipo';
                let tipoLabel = sinal.tipo || 'analisando';
                
                if (sinal.tipo === 'green' || sinal.resultado === 'GREEN') {
                    cardClass += ' green';
                    tipoClass += ' green';
                } else if (sinal.tipo === 'red' || sinal.resultado === 'LOSS') {
                    cardClass += ' red';
                    tipoClass += ' red';
                } else if (sinal.tipo === 'entrada') {
                    cardClass += ' entrada';
                    tipoClass += ' entrada';
                } else {
                    tipoClass += ' analisando';
                }
                
                const emoji = sinal.tipo === 'green' ? '✅' 
                    : sinal.tipo === 'red' ? '❌' 
                    : sinal.tipo === 'entrada' ? '🎯'
                    : '🤖';
                
                const resultado = sinal.resultado === 'GREEN' 
                    ? '<div class="card-resultado green">✅ GREEN!</div>' 
                    : sinal.resultado === 'LOSS' 
                    ? '<div class="card-resultado red">❌ LOSS</div>' 
                    : '';
                
                const status = sinal.status === 1 
                    ? '<span class="card-status active">● Ativo</span>' 
                    : sinal.status === 0 
                    ? '<span class="card-status inactive">● Inativo</span>' 
                    : '';
                
                // Badge de jogo
                const isBacBo = sinal.jogo?.toLowerCase().includes('bacbo') || 
                               sinal.gameSlug?.toLowerCase().includes('bac-bo');
                const gameBadge = isBacBo ? '🎲' : '🎡';
                
                return `
                    <div class="${cardClass}">
                        <div class="${tipoClass}">${emoji} ${tipoLabel.toUpperCase()}</div>
                        <div class="card-jogo">${gameBadge} ${sinal.jogo || 'Desconhecido'} ${isBacBo ? '🔥' : ''}</div>
                        <div class="card-id">${sinal.tipo_sinal || ''}</div>
                        ${sinal.entrada ? `<div class="card-entrada">${sinal.entrada}</div>` : ''}
                        ${sinal.anterior ? `<div class="card-anterior">📊 ${sinal.anterior}</div>` : ''}
                        ${status}
                        ${resultado}
                        <div class="card-data">🕐 ${new Date(sinal.data_criacao).toLocaleString('pt-BR')}</div>
                        ${sinal.gameSlug ? `<div class="card-slug">${sinal.gameSlug}</div>` : ''}
                    </div>
                `;
            }).join('');
        }

        // Busca inicial e每隔 5s
        buscarSinais();
        setInterval(buscarSinais, 5000);
    </script>
</body>
</html>
